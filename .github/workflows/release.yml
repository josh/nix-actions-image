name: Release

on:
  push:
    tags:
      - "*"

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Build image
        run: |
          nix build --keep-going --print-build-logs --out-link "$RUNNER_TEMP/result" \
            "github:${{ github.repository }}/${{ github.sha }}#packages.${{ matrix.system }}.image"
          "$RUNNER_TEMP/result" >"$RUNNER_TEMP/image.tar"

      - name: Push by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          nix run --inputs-from . nixpkgs#skopeo -- --insecure-policy copy \
            --dest-creds "${{ github.actor }}:$GH_TOKEN" \
            --digestfile "$RUNNER_TEMP/digest.txt" \
            "docker-archive:$RUNNER_TEMP/image.tar" \
            "docker://${IMAGE}@@unknown-digest@@"
          digest="$(cat "$RUNNER_TEMP/digest.txt")"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.system }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    name: push
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract digests from artifacts
        id: digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("${{ env.IMAGE }}@sha256:${digest}")
          done
          echo "sources=${sources[*]}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:"${GITHUB_REF_NAME}" \
            --tag ${{ env.IMAGE }}:latest \
            ${{ steps.digests.outputs.sources }}
