name: Nix

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3

      - name: Check flake
        run: |
          nix flake check --keep-going --print-build-logs \
            "github:${{ github.repository }}/${{ github.sha }}"
