name: Nix

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

      - name: Check flake
        run: |
          nix flake check --keep-going --print-build-logs \
            "github:${{ github.repository }}/${{ github.sha }}"
